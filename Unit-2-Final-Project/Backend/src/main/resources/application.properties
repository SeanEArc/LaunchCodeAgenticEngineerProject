spring.application.name=Final-Project

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
# Round 1 uses a fresh, disposable local development database. Create it once:
#   createdb -U postgres fitness_round1_dev
# Override any of these with the matching environment variable. Never commit a
# password - SPRING_DATASOURCE_PASSWORD has no default on purpose, so the app
# fails fast instead of starting with a guessable one.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fitness_round1_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------------------
# Session and cookie
# ---------------------------------------------------------------------------
# Sessions expire after 30 minutes of inactivity. A shorter value may be set
# temporarily to check expiry handling; restore the default afterwards.
server.servlet.session.timeout=${APP_SESSION_TIMEOUT:30m}
# HttpOnly keeps the cookie out of JavaScript; no token is ever put in browser
# storage. Secure stays false so local HTTP works, and is switched on through
# the environment variable when the app is served over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${APP_SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
# Comma-separated list of frontend origins allowed to send credentialed
# requests. Must match the browser's address bar exactly, hostname included.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${SERVER_PORT:8080}
